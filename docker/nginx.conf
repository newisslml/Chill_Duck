# Equivalente a vercel.json: la app es una SPA, así que cualquier ruta cae en index.html,
# y el service worker nunca se cachea para que las actualizaciones lleguen al tiro.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Archivos con hash en el nombre: no cambian nunca, se cachean un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker y archivos que lo registran: siempre se revalidan.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # nginx no conoce la extensión .webmanifest y la serviría como octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
